name: Software and RTL verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys gcc
          python -m pip install -r python_pipeline/requirements.txt
      - name: Verify regressions, all layer outputs, drivers and synthesis
        run: python scripts/verify_project.py --synthesize
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: results/verification/
